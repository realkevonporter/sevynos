# Weston configuration for the SevynOS v2 M1 image.
#
# M1 is the compositor + input + live-status milestone: the desktop shell
# is Weston's default shell, the only app is the M1 test client (one window,
# two click targets). The SevynOS shell replaces this in M2.
[core]
backend=drm-backend.so
idle-time=0
xwayland=false

[shell]
background-color=0xff101010
panel-position=none

[output]
name=Virtual-1
mode=1024x768
