# Weston configuration for the SevynOS v2 M1 image.
#
# M1 is the compositor + input + live-status milestone: the desktop shell
# is Weston's default shell, the only app is the M1 test client (one window,
# two click targets). The SevynOS shell replaces this in M2.
#
# M9: no [output] mode pin — Weston uses the output's preferred mode,
# so the desktop fills the panel at its native resolution (the GF65
# panel on hardware, 1920x1080 in QEMU when the check passes
# xres=1920,yres=1080 to virtio-gpu). The old `mode=1024x768` pin is
# what kept the desktop from going full screen: the host painted a
# 1024x768 buffer inside a 1920x1080 panel.
[core]
backend=drm-backend.so
idle-time=0
xwayland=false

[shell]
background-color=0xff101010
panel-position=none
