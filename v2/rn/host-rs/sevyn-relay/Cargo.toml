[package]
name = "sevyn-relay"
version = "0.1.0"
edition = "2021"
description = "SevynOS AI relay agent — thin local SESSION client of the AI daemon, driven by the cloud agent over the tailnet (Phase 2)"
license = "GPL-3.0-or-later"

# Phase 2 (relay agent): mutual-auth handshake (Ed25519 + ephemeral
# X25519, HKDF-SHA256), ChaCha20-Poly1305 sealed frames over NDJSON,
# one SESSION at a time against /run/sevyn-ai.sock. No per-action
# streaming: the daemon replies to SESSION with a single final line,
# so the agent forwards task -> wait -> session-end with final counts
# (see ~/workspace/sevynos-ai-relay/phase2/INTERFACES.md, design
# correction). std-only networking — no tokio.

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.3"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
