# SevynOS v2 M12 — Genesis, the GPU compositor (Kevon, 2026-11-13:
# "Start the GPU compositor" — 60 fps on the GF65; QEMU/TCG cannot
# prove the bar, so CI proves Genesis is live and the desktop works,
# and the GF65 proves the frame rate).
#
# Runs on pushes and PRs touching v2/ (the fresh build). The job builds
# the native deps (Hermes + Yoga, cached), the shell + app bundles, the
# loader + app daemon + update daemon + CLI + AI daemon, and the M12
# image (the M11 image plus Genesis: Weston on its GL renderer with a
# pixman fallback, and the RN host presenting through EGL/GLES2), then
# runs the m12-check harness:
#   1. Genesis boot (-kernel/-initrd + the data disk): Weston runs the
#      GL renderer (FAIL if the pixman fallback engaged); the host's
#      GPU present path is live (GENESIS EGL renderer line + GENESIS
#      present path=gpu + GENESIS first present); frames flow (a
#      GENESIS fps sample); the shell mounts and paints (screendump:
#      top bar + dock, as m7-check).
#   2. Fallback boot (sevyn.genesis=0): Genesis disabled, the GPU path
#      never taken, and the shell still mounts and paints on the CPU
#      painter — a GPU failure can never brick the desktop.
# Boot logs, screendumps and the JSON result are kept as artifacts.
# sevynos.img itself is NOT uploaded here (1.5 GiB) — the nightly
# (public-build.yml) publishes it on merge.
#
# QEMU has no GPU: Mesa runs on kms_swrast/llvmpipe (software GL) over
# virtio-gpu dumb buffers. The fps sample is a liveness signal only —
# the check asserts the line exists, never its value. Real-hardware
# behaviour (iris on the GF65 Intel iGPU, 60 fps) is Kevon's GF65
# verification after merge — the PR body says so.
#
# Tokrah is a PRIVATE repo — CI clones it with the TOKRAH_READ_TOKEN
# secret (a read-only repo-scoped PAT; Kevon's one-time action), because
# the image build bundles Tokrah (as M9's did). If the secret is absent
# the job fails loudly with instructions instead of silently skipping
# it. The built Tokrah bundle is NEVER committed to this repo; it is
# built fresh in the job and lives only in the build dir.
name: SevynOS v2 M12

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-m12.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-m12.yml"

jobs:
  m12-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node v5 defaults package-manager-cache to true and
          # auto-detects pnpm from the repo root's packageManager field —
          # but this job uses npm only (v2/rn/renderer, v2/shell) and
          # never installs pnpm, so the cache step fails with "Unable to
          # locate executable file: pnpm". The Hermes/Yoga deps cache is
          # handled by the actions/cache step below.
          package-manager-cache: false

      - name: Install build + boot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            qemu-system-modules-opengl \
            linux-image-generic \
            busybox-static \
            cpio \
            zstd \
            gcc \
            g++ \
            cmake \
            ninja-build \
            pkg-config \
            libwayland-dev \
            libegl-dev \
            libgles-dev \
            wayland-protocols \
            libfreetype-dev \
            libpng-dev \
            libssl-dev \
            weston \
            seatd \
            udev \
            libgl1-mesa-dri \
            adwaita-icon-theme \
            fonts-dejavu-core \
            xkb-data \
            e2fsprogs \
            curl \
            unzip \
            ca-certificates \
            fontconfig \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libcups2 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            libdbus-1-3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libgbm1 \
            libdrm2 \
            libxkbcommon0 \
            libexpat1 \
            libxcb1 \
            libxext6 \
            libfontconfig1 \
            libfreetype6 \
            libharfbuzz0b \
            libudev1 \
            libglib2.0-0 \
            libx11-6 \
            libxi6 \
            libxrender1 \
            libxtst6 \
            libxss1 \
            ovmf \
            wpasupplicant \
            iw \
            grub-efi-amd64-signed \
            grub-efi-amd64 \
            shim-signed \
            dosfstools \
            gdisk \
            mtools \
            efibootmgr \
            ntfs-3g

      - name: Clone Tokrah (private — read-only PAT)
        run: |
          if [ -z "${{ secrets.TOKRAH_READ_TOKEN }}" ]; then
            echo "::error::TOKRAH_READ_TOKEN is not set. Add a read-only repo-scoped PAT as the TOKRAH_READ_TOKEN secret on realkevonporter/sevynos (Kevon's one-time action) — the M11 image build cannot bundle Tokrah without it, and the Tokrah proof must not be skipped silently."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${{ secrets.TOKRAH_READ_TOKEN }}@github.com/realkevonporter/tokrah.git" "$GITHUB_WORKSPACE/tokrah"

      - name: Install yarn (Tokrah's pinned 1.22.22)
        run: |
          # yarn 1.22 refuses to run inside a checkout whose
          # package.json pins a different manager (sevynos pins
          # pnpm@11.17.0) — corepack failed the same way, and
          # running from /tmp does not help. Install yarn
          # globally with npm, then run every yarn command from
          # the Tokrah consumer app dir, whose package.json pins
          # yarn@1.22.22. The clone ROOT has no package.json, so
          # yarn walks up from there and hits sevynos's pnpm pin.
          # Sevynos itself stays pnpm.
          npm install -g yarn@1.22.22
          cd "$GITHUB_WORKSPACE/tokrah/tokrah"
          yarn config set registry https://registry.npmjs.org

      - name: Cache native deps (Hermes + Yoga)
        uses: actions/cache@v4
        with:
          path: v2/rn/host/deps
          key: sevynos-v2-deps-${{ hashFiles('v2/rn/host/build-deps.sh') }}-hermes-0.13.0-yoga-41118bd
          restore-keys: |
            sevynos-v2-deps-

      - name: Build native deps
        run: sh v2/rn/host/build-deps.sh

      - name: Renderer + shell + apps JS checks
        run: |
          cd v2/rn/renderer && npm ci --no-audit --no-fund && npm test
          cd ../../shell && npm ci --no-audit --no-fund && npm run typecheck && npm run build && npm test
          cd ../apps && npm ci --no-audit --no-fund && npm run typecheck && npm run build && npm test

      - name: Loader + appd + updater checks
        run: |
          python3 v2/loader/test-loader.py
          python3 v2/loader/test-appd.py
          python3 v2/ai/test-aid.py
          python3 v2/update/test-updated.py
          python3 v2/update/test-browser.py

      - name: Build the M12 image
        env:
          TOKRAH_SRC: ${{ github.workspace }}/tokrah
        run: |
          # The harness boots the built image as version m12-test-1,
          # so the image and the check agree on the version string.
          sudo env SEVYN_V2_VERSION=m12-test-1 TOKRAH_SRC="$TOKRAH_SRC" sh v2/image/build-m12-image.sh

      - name: Run the M12 check in QEMU
        run: |
          # The build step runs under sudo, so v2/image/build/ is
          # root-owned; hand it back to the runner first, or the check
          # cannot create m12-boot-*.log (EACCES — the M1 failure mode).
          sudo chown -R "$USER" v2/image/build
          node v2/image/m12-check.mjs

      - name: Upload M12 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sevynos-v2-m12
          path: |
            v2/image/build/m12-boot-*.log
            v2/image/build/m12-check.json
            v2/image/build/m12-data.img
          if-no-files-found: warn
