name: Public build

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: public-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build bootable image
        run: pnpm qemu:build
      # --- SevynOS v2 image (M8 system updates) ---------------------------
      # The nightly publishes a real, bootable v2 image alongside the old
      # tree's ISO: vmlinuz + initramfs.cpio.gz + checksums + boot notes.
      # The Hermes/Yoga deps are cached on the same key as v2-m3.yml, so
      # a warm cache makes this a few minutes on top of the old build.
      - name: Install v2 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            linux-image-generic \
            busybox-static \
            cpio \
            zstd \
            gcc \
            g++ \
            cmake \
            ninja-build \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libfreetype-dev \
            libpng-dev \
            libssl-dev \
            weston \
            seatd \
            udev \
            libgl1-mesa-dri \
            adwaita-icon-theme \
            fonts-dejavu-core \
            xkb-data \
            ovmf \
            grub-efi-amd64-signed \
            grub-efi-amd64 \
            shim-signed \
            dosfstools \
            gdisk \
            mtools
      - name: Clone Tokrah (private — read-only PAT)
        run: |
          if [ -z "${{ secrets.TOKRAH_READ_TOKEN }}" ]; then
            echo "::error::TOKRAH_READ_TOKEN is not set. Add a read-only repo-scoped PAT as the TOKRAH_READ_TOKEN secret on realkevonporter/sevynos (Kevon's one-time action) — the nightly M7 image includes Tokrah and cannot build without it."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${{ secrets.TOKRAH_READ_TOKEN }}@github.com/realkevonporter/tokrah.git" "$GITHUB_WORKSPACE/tokrah"
      - name: Install yarn (Tokrah's pinned 1.22.22)
        run: |
          # yarn 1.22 refuses to run inside a checkout whose
          # package.json pins a different manager (sevynos pins
          # pnpm@11.17.0). Install yarn globally with npm, then
          # run every yarn command from the Tokrah consumer app
          # dir, whose package.json pins yarn@1.22.22. The clone
          # ROOT has no package.json, so yarn walks up from there
          # and hits sevynos's pnpm pin. Sevynos itself stays pnpm.
          npm install -g yarn@1.22.22
          cd "$GITHUB_WORKSPACE/tokrah/tokrah"
          yarn config set registry https://registry.npmjs.org
      - name: Cache v2 native deps (Hermes + Yoga)
        uses: actions/cache@v4
        with:
          path: v2/rn/host/deps
          key: sevynos-v2-deps-${{ hashFiles('v2/rn/host/build-deps.sh') }}-hermes-0.13.0-yoga-41118bd
          restore-keys: |
            sevynos-v2-deps-
      - name: Build v2 native deps
        run: sh v2/rn/host/build-deps.sh
      - name: Build v2 (M9 desktop polish) image
        env:
          TOKRAH_SRC: ${{ github.workspace }}/tokrah
        run: |
          sudo env TOKRAH_SRC="$TOKRAH_SRC" sh v2/image/build-m9-image.sh
          sudo chown -R "$USER" v2/image/build
      - name: Prepare v2 nightly artifacts
        run: |
          cd v2/image/build
          sha256sum vmlinuz initramfs.cpio.gz sevynos.img > v2-SHA256SUMS
          cat > v2-BOOT-NOTES.txt <<'EOF'
          SevynOS v2 (M9 desktop polish) — bootable image
          ==============================================
          Kernel + initramfs for QEMU (x86_64), plus sevynos.img — a
          GPT USB-boot disk image for real hardware. Boots to the
          SevynOS shell: top bar with live status, main area, dock
          with 12 apps — and dock clicks open the app in its own
          window (one sandboxed Hermes runtime per app). Stock apps
          install from pristine bundles in the image; delete one and
          reinstall it offline. The system now updates itself in
          place (A/B slots, signed updates-v2.json feed) — no USB
          re-flash: the updater syncs the ESP, so an installed
          system boots the new kernel after an update, and falls
          back to the previous slot after two failed boots.
          Terminal, Settings, and Files are real system apps now:
          the Terminal runs only the `sevyn` CLI (no bash — it is the
          recovery path: kill the shell, start it back from the
          Terminal); Settings changes the update channel for real;
          Files opens real directories. Sevyn Code is baked in and
          serving on the machine; its terminal defaults to `sevyn`.
          AI is baked in through the connector: any AI plugs in via
          `sevyn ai` (echo-ai and plan-ai ship as stubs) and drives
          the system through permissions — launch apps, change system
          values. Pick the AI in Settings; an action outside its
          grant is refused, never executed.
          The Browser is a real app now: Chromium is baked in, and
          the Browser (tabs + address bar) drives it over CDP —
          `sevyn browser open <url>` from the Terminal does the same.
          Sevyn Code finally paints in a window: open it from the
          Browser at http://127.0.0.1:8080/.
          Tokrah runs as a third-party app: `sevyn tokrah run` in the
          Terminal, or from the dock.
          M7: the image boots on real hardware — Intel i915 graphics,
          Intel wifi (iwlwifi), NVMe storage, wired LAN, HDA audio —
          and the network now comes from DHCP instead of a hardcoded
          address. The GPT image boots under UEFI with Secure Boot ON
          (Microsoft-signed shim + Canonical-signed GRUB).
          M9: the desktop fills the panel at its native resolution;
          Settings has Wi-Fi (scan, connect, connected state);
          windows drag to move and resize; the stock apps show real
          content (working calculator, real calendar, notes,
          installed-app store) instead of empty windows.

          Boot it in QEMU (4 GB RAM: Chromium + Sevyn Code run in the image):
            qemu-system-x86_64 -machine q35 -m 4096 -kernel vmlinuz \
              -initrd initramfs.cpio.gz -append "console=ttyS0" \
              -vga none -device virtio-gpu-pci -device qemu-xhci \
              -device usb-tablet -nic user,model=virtio-net-pci

          Boot it in QEMU the way real hardware does (UEFI + NVMe):
            qemu-system-x86_64 -machine q35,accel=kvm -m 4096 \
              -drive if=pflash,format=raw,unit=0,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd,readonly=on \
              -drive if=pflash,format=raw,unit=1,file=<copy of OVMF_VARS_4M.ms.fd> \
              -drive file=sevynos.img,format=raw,if=none,id=nvme0 \
              -device nvme,drive=nvme0,serial=sevynos0 \
              -device virtio-gpu-pci -device qemu-xhci \
              -device usb-tablet -nic user,model=virtio-net-pci

          Boot it on real hardware (MSI GF65 Thin 9SD and friends):
            dd if=sevynos.img of=/dev/sdX bs=4M status=progress
            (sdX is the USB stick — NOT the internal disk), then
            boot from USB. It does not touch the internal disk;
            M7 is "boot", not "install".

          Verify the download with v2-SHA256SUMS.
          This is a development snapshot, not a stable release.
          EOF
          ls -l vmlinuz initramfs.cpio.gz sevynos.img v2-SHA256SUMS v2-BOOT-NOTES.txt
      - name: Generate the v2 update feed
        env:
          SEVYN_NIGHTLY_UPDATE_SIGNING_KEY: ${{ secrets.SEVYN_NIGHTLY_UPDATE_SIGNING_KEY }}
        run: |
          # The v2 updater's feed (updates-v2.json): version + hashes of
          # the freshly built v2 image. Signed when the signing secret
          # is set and the trust anchor is committed (see v2/README.md
          # for the one-time provisioning); otherwise it ships unsigned
          # and devices refuse it (fail-closed) — the nightly still
          # publishes. The secret is written to a 0600 temp file and
          # removed on exit; it never enters the image or the logs.
          KEY_ARGS=""
          if [ -n "${SEVYN_NIGHTLY_UPDATE_SIGNING_KEY:-}" ]; then
            printf '%s' "$SEVYN_NIGHTLY_UPDATE_SIGNING_KEY" > /tmp/update-signing-key.json
            chmod 600 /tmp/update-signing-key.json
            KEY_ARGS="--key-file /tmp/update-signing-key.json"
            trap 'rm -f /tmp/update-signing-key.json' EXIT
          fi
          ANCHOR_ARGS=""
          if [ -f v2/update/trusted-update-keys.json ]; then
            ANCHOR_ARGS="--anchor v2/update/trusted-update-keys.json"
          fi
          # shellcheck disable=SC2086
          python3 v2/image/make-v2-feed.py --build-dir v2/image/build \
            --out v2/image/build/updates-v2.json $KEY_ARGS $ANCHOR_ARGS
      - name: Publish nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly build
          body: |
            Automated SevynOS build from the latest merge to main.

            Commit: ${{ github.sha }}

            This is a development snapshot, not a stable release.
            Verify the download with the attached SHA256SUMS.

            SevynOS v2 (M9 desktop polish) image: vmlinuz + initramfs.cpio.gz + sevynos.img
            (see v2-BOOT-NOTES.txt). Boots to the shell — top bar, live
            status tray, dock with 12 apps — and dock clicks open apps
            in their own windows. Terminal, Settings, Files, and the
            Browser are real system apps now, and Sevyn Code is baked
            into the image and paints in a window through Chromium.
            AI is baked in through the connector: `sevyn ai` plugs an
            AI in (echo-ai and plan-ai ship as stubs) and drives the
            system through permissions; pick the AI in Settings.
            Tokrah runs as a third-party app. M7: the image boots on
            real hardware — sevynos.img is a GPT USB-boot disk image
            (UEFI, Secure Boot) for the MSI GF65 Thin 9SD and friends.
            M9: full-screen desktop, wifi in Settings, movable and
            resizable windows, real app content, and in-place updates
            that sync the ESP (no USB re-flash).
            The v1 ISO below is the old
            tree's image. updates-v2.json is the v2 update feed: an
            installed v2 system checks it and updates in place (A/B
            slots, signed).
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
          # rootfs.squashfs + updates.json feed the OS update service's
          # check/download/apply flow (Settings → Software Update).
          # The v2-* files are the M9 desktop-polish image (kernel + initramfs + GPT disk image).
          artifacts: "tools/qemu/build/sevynos-live.iso,tools/qemu/build/SHA256SUMS,tools/qemu/build/rootfs.squashfs,tools/qemu/build/updates.json,v2/image/build/vmlinuz,v2/image/build/initramfs.cpio.gz,v2/image/build/sevynos.img,v2/image/build/v2-SHA256SUMS,v2/image/build/v2-BOOT-NOTES.txt,v2/image/build/updates-v2.json"
