name: Public build

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: public-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build bootable image
        run: pnpm qemu:build
      # --- SevynOS v2 image (M8 system updates) ---------------------------
      # The nightly publishes a real, bootable v2 image alongside the old
      # tree's ISO: vmlinuz + initramfs.cpio.gz + checksums + boot notes.
      # The Hermes/Yoga deps are cached on the same key as v2-m3.yml, so
      # a warm cache makes this a few minutes on top of the old build.
      - name: Install v2 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            linux-image-generic \
            busybox-static \
            cpio \
            zstd \
            gcc \
            g++ \
            cmake \
            ninja-build \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libfreetype-dev \
            libpng-dev \
            libssl-dev \
            weston \
            seatd \
            udev \
            libgl1-mesa-dri \
            adwaita-icon-theme \
            fonts-dejavu-core \
            xkb-data
      - name: Cache v2 native deps (Hermes + Yoga)
        uses: actions/cache@v4
        with:
          path: v2/rn/host/deps
          key: sevynos-v2-deps-${{ hashFiles('v2/rn/host/build-deps.sh') }}-hermes-0.13.0-yoga-41118bd
          restore-keys: |
            sevynos-v2-deps-
      - name: Build v2 native deps
        run: sh v2/rn/host/build-deps.sh
      - name: Build v2 (M4 system apps) image
        run: |
          sudo sh v2/image/build-m4-image.sh
          sudo chown -R "$USER" v2/image/build
      - name: Prepare v2 nightly artifacts
        run: |
          cd v2/image/build
          sha256sum vmlinuz initramfs.cpio.gz > v2-SHA256SUMS
          cat > v2-BOOT-NOTES.txt <<'EOF'
          SevynOS v2 (M4 system apps) — bootable image
          ===========================================
          Kernel + initramfs for QEMU (x86_64). Boots to the SevynOS shell:
          top bar with live status, main area, dock with 12 apps — and
          dock clicks now open the app in its own window (one sandboxed
          Hermes runtime per app). Stock apps install from pristine
          bundles in the image; delete one and reinstall it offline.
          The system now updates itself in place (A/B slots, signed
          updates-v2.json feed) — no USB re-flash.
          Terminal, Settings, and Files are real system apps now:
          the Terminal runs only the `sevyn` CLI (no bash — it is the
          recovery path: kill the shell, start it back from the
          Terminal); Settings changes the update channel for real;
          Files opens real directories. Sevyn Code is baked in and
          serving on the machine; its terminal defaults to `sevyn`.

          Boot it (2 GB RAM: Sevyn Code runs in the image):
            qemu-system-x86_64 -machine q35 -m 2048 -kernel vmlinuz \
              -initrd initramfs.cpio.gz -append "console=ttyS0" \
              -vga none -device virtio-gpu-pci -device qemu-xhci \
              -device usb-tablet -nic none

          Verify the download with v2-SHA256SUMS.
          This is a development snapshot, not a stable release.
          EOF
          ls -l vmlinuz initramfs.cpio.gz v2-SHA256SUMS v2-BOOT-NOTES.txt
      - name: Generate the v2 update feed
        env:
          SEVYN_UPDATE_SIGNING_KEY: ${{ secrets.SEVYN_UPDATE_SIGNING_KEY }}
        run: |
          # The v2 updater's feed (updates-v2.json): version + hashes of
          # the freshly built v2 image. Signed when the signing secret
          # is set and the trust anchor is committed (see v2/README.md
          # for the one-time provisioning); otherwise it ships unsigned
          # and devices refuse it (fail-closed) — the nightly still
          # publishes. The secret is written to a 0600 temp file and
          # removed on exit; it never enters the image or the logs.
          KEY_ARGS=""
          if [ -n "${SEVYN_UPDATE_SIGNING_KEY:-}" ]; then
            printf '%s' "$SEVYN_UPDATE_SIGNING_KEY" > /tmp/update-signing-key.json
            chmod 600 /tmp/update-signing-key.json
            KEY_ARGS="--key-file /tmp/update-signing-key.json"
            trap 'rm -f /tmp/update-signing-key.json' EXIT
          fi
          ANCHOR_ARGS=""
          if [ -f v2/update/trusted-update-keys.json ]; then
            ANCHOR_ARGS="--anchor v2/update/trusted-update-keys.json"
          fi
          # shellcheck disable=SC2086
          python3 v2/image/make-v2-feed.py --build-dir v2/image/build \
            --out v2/image/build/updates-v2.json $KEY_ARGS $ANCHOR_ARGS
      - name: Publish nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly build
          body: |
            Automated SevynOS build from the latest merge to main.

            Commit: ${{ github.sha }}

            This is a development snapshot, not a stable release.
            Verify the download with the attached SHA256SUMS.

            SevynOS v2 (M4 system apps) image: vmlinuz + initramfs.cpio.gz
            (see v2-BOOT-NOTES.txt). Boots to the shell — top bar, live
            status tray, dock with 12 apps — and dock clicks open apps
            in their own windows. Terminal, Settings, and Files are real
            system apps now, and Sevyn Code is baked into the image.
            The v1 ISO below is the old
            tree's image. updates-v2.json is the v2 update feed: an
            installed v2 system checks it and updates in place (A/B
            slots, signed).
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
          # rootfs.squashfs + updates.json feed the OS update service's
          # check/download/apply flow (Settings → Software Update).
          # The v2-* files are the M4 system-apps image (kernel + initramfs).
          artifacts: "tools/qemu/build/sevynos-live.iso,tools/qemu/build/SHA256SUMS,tools/qemu/build/rootfs.squashfs,tools/qemu/build/updates.json,v2/image/build/vmlinuz,v2/image/build/initramfs.cpio.gz,v2/image/build/v2-SHA256SUMS,v2/image/build/v2-BOOT-NOTES.txt,v2/image/build/updates-v2.json"
