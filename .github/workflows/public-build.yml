name: Public build

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: public-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # --- SevynOS v2 image (M8 system updates) ---------------------------
      # The nightly publishes the v2 image: vmlinuz + initramfs.cpio.gz +
      # checksums + boot notes. The Hermes/Yoga deps are cached on the same
      # key as v2-m3.yml, so a warm cache makes this a few minutes.
      - name: Install v2 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            linux-image-generic \
            busybox-static \
            cpio \
            zstd \
            gcc \
            g++ \
            cmake \
            ninja-build \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libudev-dev \
            libinput-dev \
            libgbm-dev \
            libseat-dev \
            libdrm-dev \
            libpixman-1-dev \
            libegl-dev \
            libgles-dev \
            wayland-protocols \
            libfreetype-dev \
            libpng-dev \
            libjpeg-turbo8-dev \
            libssl-dev \
            libasound2-dev \
            seatd \
            udev \
            libgl1-mesa-dri \
            adwaita-icon-theme \
            fonts-dejavu-core \
            xkb-data \
            ovmf \
            grub-efi-amd64-signed \
            grub-efi-amd64 \
            shim-signed \
            dosfstools \
            gdisk \
            mtools \
            wpasupplicant \
            iw
          # UVC camera modules (videobuf2-core et al.) ship in
          # linux-modules-extra, not the base linux-modules package —
          # without them the M13 image build fails at stage-modules.py
          # with "module videobuf2-core not found". There is no
          # linux-modules-extra-generic metapackage in noble (apt
          # cannot locate it), so install the -extra package for the
          # newest generic kernel in /boot — the same kernel
          # build-m13-image.sh picks.
          KVER="$(basename "$(ls /boot/vmlinuz-*-generic | sort -V | tail -n 1)" | sed 's/^vmlinuz-//')"
          sudo apt-get install -y -qq "linux-modules-extra-${KVER}"
      - name: Cache v2 native deps (Hermes + Yoga)
        uses: actions/cache@v4
        with:
          path: v2/rn/host/deps
          key: sevynos-v2-deps-${{ hashFiles('v2/rn/host/build-deps.sh') }}-hermes-0.13.0-yoga-41118bd
          restore-keys: |
            sevynos-v2-deps-
      - name: Build v2 native deps
        run: sh v2/rn/host/build-deps.sh
      - name: Build v2 (Genesis standalone compositor) image
        run: |
          sudo sh v2/image/build-genesis-image.sh
          sudo chown -R "$USER" v2/image/build
          # The Genesis builder names its output sevynos-genesis.img
          # so the two images cannot be confused; the nightly
          # publishes it under the established sevynos.img name
          # (the flash + update flows and the release history all
          # use that name).
          mv v2/image/build/sevynos-genesis.img v2/image/build/sevynos.img
      - name: Guard v2 shell icons in initramfs
        run: |
          zcat v2/image/build/initramfs.cpio.gz | cpio -t 2>/dev/null > /tmp/initramfs-list.txt
          for f in files terminal browser settings music photos calendar notes calculator camera messages store video-calls voice-calls installer; do
            grep -qx "usr/share/sevyn/shell/icons/$f.png" /tmp/initramfs-list.txt || { echo "error: missing icon usr/share/sevyn/shell/icons/$f.png in initramfs" >&2; exit 1; }
          done
      - name: Guard v2 commsd + mock comms servers in initramfs
        run: |
          zcat v2/image/build/initramfs.cpio.gz | cpio -t 2>/dev/null > /tmp/initramfs-list.txt
          grep -qx "usr/share/sevyn/comms/commsd.mjs" /tmp/initramfs-list.txt || { echo "error: missing commsd usr/share/sevyn/comms/commsd.mjs in initramfs" >&2; exit 1; }
          grep -qx "usr/share/sevyn/comms-mock/mock-matrix.js" /tmp/initramfs-list.txt || { echo "error: missing mock homeserver usr/share/sevyn/comms-mock/mock-matrix.js in initramfs" >&2; exit 1; }
          grep -qx "usr/share/sevyn/comms-mock/mock-acs.js" /tmp/initramfs-list.txt || { echo "error: missing mock ACS usr/share/sevyn/comms-mock/mock-acs.js in initramfs" >&2; exit 1; }
      - name: Prepare v2 nightly artifacts
        run: |
          cd v2/image/build
          # sevynos.img.gz is the only published image: the raw image
          # sits at its partition-layout floor (2 GiB) and only grows
          # from here, while the gzip is ~950 MB — and the raw .img is
          # past GitHub's 2 GiB release-asset cap, so it can no longer
          # be published at all. The .gz is the durable answer: the
          # updater never downloads the image (only vmlinuz +
          # initramfs), and the manual flash flow already works from
          # the .gz (Etcher writes it directly; with dd, gunzip first).
          gzip -9 -k sevynos.img
          sha256sum vmlinuz initramfs.cpio.gz sevynos.img.gz > v2-SHA256SUMS
          cat > v2-BOOT-NOTES.txt <<'EOF'
          SevynOS v2 (Genesis standalone compositor) — bootable image
          ==============================================
          Kernel + initramfs for QEMU (x86_64), plus sevynos.img.gz —
          the GPT USB-boot disk image for real hardware, compressed
          (gunzip it, or let Etcher write it directly). Boots to the
          SevynOS shell: top bar with live status, main area, dock
          with 12 apps — and dock clicks open the app in its own
          window (one sandboxed Hermes runtime per app). Stock apps
          install from pristine bundles in the image; delete one and
          reinstall it offline. The system now updates itself in
          place (A/B slots, signed updates-v2.json feed) — no USB
          re-flash: the updater syncs the ESP, so an installed
          system boots the new kernel after an update, and falls
          back to the previous slot after two failed boots.
          Terminal, Settings, and Files are real system apps now:
          the Terminal runs only the `sevyn` CLI (no bash — it is the
          recovery path: kill the shell, start it back from the
          Terminal); Settings changes the update channel for real;
          Files opens real directories. Sevyn Code is baked in and
          serving on the machine; its terminal defaults to `sevyn`.
          AI is baked in through the connector: any AI plugs in via
          `sevyn ai` (echo-ai and plan-ai ship as stubs) and drives
          the system through permissions — launch apps, change system
          values. Pick the AI in Settings; an action outside its
          grant is refused, never executed.
          The Browser is a real app now: Chromium is baked in, and
          the Browser (tabs + address bar) drives it over CDP —
          `sevyn browser open <url>` from the Terminal does the same.
          Sevyn Code finally paints in a window: open it from the
          Browser at http://127.0.0.1:8080/.
          M7: the image boots on real hardware — Intel i915 graphics,
          Intel wifi (iwlwifi), NVMe storage, wired LAN, HDA audio —
          and the network now comes from DHCP instead of a hardcoded
          address. The GPT image boots under UEFI with Secure Boot ON
          (Microsoft-signed shim + Canonical-signed GRUB).
          M9: the desktop fills the panel at its native resolution;
          Settings has Wi-Fi (scan, connect, connected state);
          windows drag to move and resize; the stock apps show real
          content (working calculator, real calendar, notes,
          installed-app store) instead of empty windows.
          M11: the live image installs SevynOS ALONGSIDE Windows 11
          without wiping it — open the Installer app (or run
          `sevyn install probe` / `plan` / `install` in the
          Terminal): it detects the Windows install, installs into
          free space or replaces an existing SevynOS install, and
          sets up a GRUB boot menu with entries for SevynOS and
          Windows 11. It never touches the Windows partition's data
          and never writes anything before you confirm the plan.
          M12: Genesis, the standalone compositor — the whole
          desktop (shell, dock, apps) now runs under
          sevyn-compositor on DRM/KMS, with no Weston anywhere in
          this image. It renders with GLES; `sevyn.pixman=1` forces
          the Pixman renderer, and `sevyn.recovery=1` boots straight
          into the recovery console. The 60 fps bar is proven on the
          GF65, not in QEMU.
          M13: the Browser is a real embed now — Chromium runs as a
          chromeless app-mode window paired with the Browser app
          (tabs + address bar are the only chrome), sized to the
          Browser window's content area. `sevyn browser` tries the
          GPU first and falls back to software rendering, and
          `sevyn browser quit` stops Chromium cleanly.

          Boot it in QEMU (4 GB RAM: Chromium + Sevyn Code run in the image):
            qemu-system-x86_64 -machine q35 -m 4096 -kernel vmlinuz \
              -initrd initramfs.cpio.gz -append "console=ttyS0" \
              -vga none -device virtio-gpu-pci -device qemu-xhci \
              -device usb-tablet -nic user,model=virtio-net-pci

          Boot it in QEMU the way real hardware does (UEFI + NVMe):
            qemu-system-x86_64 -machine q35,accel=kvm -m 4096 \
              -drive if=pflash,format=raw,unit=0,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd,readonly=on \
              -drive if=pflash,format=raw,unit=1,file=<copy of OVMF_VARS_4M.ms.fd> \
              -drive file=sevynos.img,format=raw,if=none,id=nvme0 \
              -device nvme,drive=nvme0,serial=sevynos0 \
              -device virtio-gpu-pci -device qemu-xhci \
              -device usb-tablet -nic user,model=virtio-net-pci

          Boot it on real hardware (MSI GF65 Thin 9SD and friends):
            Download sevynos.img.gz — the disk image is published
            compressed only (the raw .img is past GitHub's 2 GiB
            release-asset cap). Etcher writes it directly; with dd,
            gunzip it first (`gunzip sevynos.img.gz`), then:
            dd if=sevynos.img of=/dev/sdX bs=4M status=progress
            (sdX is the USB stick — NOT the internal disk), then
            boot from USB. It does not touch the internal disk;
            M7 is "boot", not "install".

          Verify the download with v2-SHA256SUMS.
          This is a development snapshot, not a stable release.
          EOF
          ls -l vmlinuz initramfs.cpio.gz sevynos.img sevynos.img.gz v2-SHA256SUMS v2-BOOT-NOTES.txt
      - name: Generate the v2 update feed
        env:
          SEVYN_NIGHTLY_UPDATE_SIGNING_KEY: ${{ secrets.SEVYN_NIGHTLY_UPDATE_SIGNING_KEY }}
        run: |
          # The v2 updater's feed (updates-v2.json): version + hashes of
          # the freshly built v2 image. Signed when the signing secret
          # is set and the trust anchor is committed (see v2/README.md
          # for the one-time provisioning); otherwise it ships unsigned
          # and devices refuse it (fail-closed) — the nightly still
          # publishes. The secret is written to a 0600 temp file and
          # removed on exit; it never enters the image or the logs.
          KEY_ARGS=""
          if [ -n "${SEVYN_NIGHTLY_UPDATE_SIGNING_KEY:-}" ]; then
            printf '%s' "$SEVYN_NIGHTLY_UPDATE_SIGNING_KEY" > /tmp/update-signing-key.json
            chmod 600 /tmp/update-signing-key.json
            KEY_ARGS="--key-file /tmp/update-signing-key.json"
            trap 'rm -f /tmp/update-signing-key.json' EXIT
          fi
          ANCHOR_ARGS=""
          if [ -f v2/update/trusted-update-keys.json ]; then
            ANCHOR_ARGS="--anchor v2/update/trusted-update-keys.json"
          fi
          # shellcheck disable=SC2086
          python3 v2/image/make-v2-feed.py --build-dir v2/image/build \
            --out v2/image/build/updates-v2.json $KEY_ARGS $ANCHOR_ARGS
      - name: Guard release assets under the 2 GiB cap
        run: |
          # GitHub caps release assets at 2 GiB (2147483648 bytes). The
          # M12 image crossed it and the publish only warned, so the
          # nightly shipped with no sevynos.img. Fail here, before
          # publishing, if any v2 asset is at or over the cap.
          python3 - <<'EOF'
          import os, sys
          CAP = 2147483648
          bad = []
          for name in ("vmlinuz", "initramfs.cpio.gz", "sevynos.img.gz"):
              p = os.path.join("v2/image/build", name)
              size = os.path.getsize(p)
              print(f"{name}: {size} bytes")
              if size >= CAP:
                  bad.append(f"{name} is {size} bytes (>= 2 GiB cap)")
          if bad:
              print("ERROR: " + "; ".join(bad), file=sys.stderr)
              sys.exit(1)
          print("all v2 release assets under the 2 GiB cap")
          EOF
      - name: Publish nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly build
          body: |
            Automated SevynOS build from the latest merge to main.

            Commit: ${{ github.sha }}

            This is a development snapshot, not a stable release.
            Verify the download with the attached SHA256SUMS.

            SevynOS v2 (Genesis standalone compositor) image: vmlinuz + initramfs.cpio.gz + sevynos.img.gz
            (see v2-BOOT-NOTES.txt). Boots to the shell — top bar, live
            status tray, dock with 12 apps — and dock clicks open apps
            in their own windows. Terminal, Settings, Files, and the
            Browser are real system apps now, and Sevyn Code is baked
            into the image and paints in a window through Chromium.
            AI is baked in through the connector: `sevyn ai` plugs an
            AI in (echo-ai and plan-ai ship as stubs) and drives the
            system through permissions; pick the AI in Settings.
            M7: the image boots on
            real hardware — sevynos.img.gz is a GPT USB-boot disk image
            (UEFI, Secure Boot, compressed — gunzip or Etcher to flash)
            for the MSI GF65 Thin 9SD and friends.
            M9: full-screen desktop, wifi in Settings, movable and
            resizable windows, real app content, and in-place updates
            that sync the ESP (no USB re-flash).
            M11: the live image installs SevynOS alongside Windows 11
            (Installer app or `sevyn install`) with a GRUB boot menu
            for both OSes.
            M12: Genesis, the standalone compositor — the desktop
            runs under sevyn-compositor on DRM/KMS, with no Weston
            in the image (Pixman via `sevyn.pixman=1`, recovery
            console via `sevyn.recovery=1`).
            M13: the Browser embed — Chromium runs chromeless beside
            the Browser app window, GPU first with a software
            fallback, driven over CDP.
            updates-v2.json is the v2 update feed: an
            installed v2 system checks it and updates in place (A/B
            slots, signed).
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
          # The M12 image hit 2,190,475,264 bytes — over GitHub's 2 GiB
          # release-asset cap — and the publish step only warned, so
          # the nightly shipped with no fresh-install image and the
          # job stayed green. Both guards below make a missing image
          # fail the build loudly instead.
          artifactErrorsFailBuild: true
          # The v2-* files are the Genesis image (kernel + initramfs + GPT disk image).
          artifacts: "v2/image/build/vmlinuz,v2/image/build/initramfs.cpio.gz,v2/image/build/sevynos.img.gz,v2/image/build/v2-SHA256SUMS,v2/image/build/v2-BOOT-NOTES.txt,v2/image/build/updates-v2.json"
