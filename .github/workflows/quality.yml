name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # graphics/core/ is generated, not tracked: materialize it from the
      # pinned Genesis commit before pnpm install — the workspace lockfile
      # expects @sevynos/graphics at graphics/core/.
      - run: sh v2/image/fetch-genesis.sh model
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  native-wayland:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hosts/linux/native
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwayland-dev libxkbcommon-dev pkg-config
      - run: cargo test --locked

  # camd (native camera daemon): compile it and prove the socket
  # protocol against the synthetic source — no camera hardware in
  # CI. The image build (v2-m13.yml) is the gate for staging; this
  # job is the gate for the daemon itself.
  camd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # setup-node's package-manager cache lookup needs pnpm on
      # PATH (it fails the job before any step runs without it —
      # the `check` job installs it the same way). No pnpm install
      # runs in this job (one plain node script), so the
      # auto-detected pnpm cache has nothing to save and the
      # post-job save errors with a Path Validation Error — disable
      # it (setup-node v5 auto-enables caching from the
      # packageManager field otherwise).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install camd build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          gcc libjpeg-turbo8-dev libpng-dev zlib1g-dev
      - run: node v2/camera/camd-check.mjs

  # audiod: the native audio service (v2/audio). Compiles the daemon
  # against the runner's libasound headers and proves it against the
  # ALSA null PCM device — decodes all four formats, real-time
  # position, guarded bad calls — with no audio hardware. Real
  # audible output is GF65-only (see v2/audio/README.md).
  audiod:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          gcc libasound2-dev
      - name: Compile audiod
        run: >-
          gcc -O2 -Wall -Wextra -o /tmp/sevyn-audiod
          v2/audio/audiod.c v2/audio/audio-decode.c
          v2/audio/third_party/stb_vorbis.c -lasound -lm -lpthread
      - name: Generate test media (7 WAVs, exact durations)
        run: python3 v2/audio/gen-test-media.py /tmp/sevyn-test-media/audio
      - name: Run audiod harness (null device, 7 test WAVs + fixtures)
        run: SEVYN_AUDIOD_BIN=/tmp/sevyn-audiod SEVYN_AUDIO_TEST_MEDIA=/tmp/sevyn-test-media/audio node v2/audio/test-audiod.mjs
