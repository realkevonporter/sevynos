name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prettier over the whole remaining tree (v2/, workflows, docs).
  # The old pnpm/turbo workspace is gone (removed 2026-11-21); the v2
  # milestone workflows own typecheck/lint/test/build for v2 itself.
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx -y prettier@3.9.6 --check "v2/**/*.{ts,tsx,js,mjs,json,md}" ".github/workflows/*.yml" "*.md"

  # camd (native camera daemon): compile it and prove the socket
  # protocol against the synthetic source — no camera hardware in
  # CI. The image build (v2-m13.yml) is the gate for staging; this
  # job is the gate for the daemon itself.
  camd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install camd build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          gcc libjpeg-turbo8-dev libpng-dev zlib1g-dev
      - run: node v2/camera/camd-check.mjs

  # audiod: the native audio service (v2/audio). Compiles the daemon
  # against the runner's libasound headers and proves it against the
  # ALSA null PCM device — decodes all four formats, real-time
  # position, guarded bad calls — with no audio hardware. Real
  # audible output is GF65-only (see v2/audio/README.md).
  audiod:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          gcc libasound2-dev
      - name: Compile audiod
        run: >-
          gcc -O2 -Wall -Wextra -o /tmp/sevyn-audiod
          v2/audio/audiod.c v2/audio/audio-decode.c
          v2/audio/third_party/stb_vorbis.c -lasound -lm -lpthread
      - name: Generate test media (7 WAVs, exact durations)
        run: python3 v2/audio/gen-test-media.py /tmp/sevyn-test-media/audio
      - name: Run audiod harness (null device, 7 test WAVs + fixtures)
        run: SEVYN_AUDIOD_BIN=/tmp/sevyn-audiod SEVYN_AUDIO_TEST_MEDIA=/tmp/sevyn-test-media/audio node v2/audio/test-audiod.mjs

  # rn-audio: the RN audio module (v2/rn) — the audiod client the host
  # speaks plus the JS media/audio adapters. The C++ test drives the
  # client against a fake audiod (no daemon, no hardware); the JS
  # test drives the adapters against a mock Sevyn.audio* host. No
  # Hermes/Yoga build needed for either — the host compile itself is
  # covered by the host-compile job below.
  rn-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Compile + run the audiod client test (fake daemon)
        run: >-
          g++ -O2 -std=c++17 -Wall -Wextra -o /tmp/test-audiod-client
          v2/rn/host/audiod-client.cc v2/rn/host/test-audiod-client.cc
          -lpthread && /tmp/test-audiod-client
      - name: Run the JS audio adapter tests (mock host)
        run: node v2/rn/renderer/test/audio-test.js

  # host-compile: the RN host (v2/rn/host) — the gate PR #158's
  # `namespace` issue proved was missing. The m2–m13 image builds were
  # the only compile gate for the host, so a host syntax error reached
  # CI. This job builds the host with the same build-host.sh the
  # shipping image uses (so the two can never drift) and the Rust
  # workspace (cargo build, rustup pinned 1.100.0 via
  # rust-toolchain.toml) on every PR. Hermes + Yoga are cached in
  # v2/rn/host/deps (build-deps.sh is idempotent via its marker); a
  # cache miss builds them (~10–20 min), hence the longer timeout.
  host-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install host build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          gcc g++ cmake ninja-build pkg-config curl python3
          libwayland-dev libegl-dev libgles-dev wayland-protocols
          libfreetype-dev libpng-dev libicu-dev
      - name: Cache native deps (Hermes + Yoga)
        uses: actions/cache@v4
        with:
          path: v2/rn/host/deps
          key: sevyn-deps-${{ hashFiles('v2/rn/host/build-deps.sh') }}
          restore-keys: |
            sevyn-deps-
      - name: Build native deps (Hermes + Yoga; cached after first run)
        run: sh v2/rn/host/build-deps.sh
      - name: Build the C++ host (same script as the shipping image)
        run: >-
          sh v2/rn/host/build-host.sh v2/rn/host/deps
          /usr/share/wayland-protocols /tmp/sevyn-rn-host /tmp/sevyn-host-build
      - name: Compile + run the key-modifier unit test (no Wayland, no Hermes)
        run: >-
          g++ -O2 -std=c++17 -Wall -Wextra -I v2/rn/host
          -o /tmp/test-key-modifiers v2/rn/host/test-key-modifiers.cc
          && /tmp/test-key-modifiers
      - name: Compile + run the text-clipboard unit test (no Wayland, no Hermes)
        run: >-
          g++ -O2 -std=c++17 -Wall -Wextra -I v2/rn/host
          -o /tmp/test-text-clipboard v2/rn/host/test-text-clipboard.cc
          && /tmp/test-text-clipboard
      - name: Build the Rust workspace
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --manifest-path v2/rn/host-rs/Cargo.toml
          cargo test -p sevyn-relay --manifest-path v2/rn/host-rs/Cargo.toml
          cargo fmt --check --manifest-path v2/rn/host-rs/Cargo.toml
