# SevynOS v2 M5 — build the connectivity + Chromium image and prove it
# in QEMU.
#
# Runs on pushes and PRs touching v2/ (the fresh build). The job builds
# the native deps (Hermes + Yoga, cached), the shell + app bundles, the
# loader + app daemon + update daemon + CLI + AI daemon, and the M5
# image (the M4.5 image plus the trimmed Chromium snapshot, the
# Browser app, and the `sevyn browser` / `sevyn net` CLI verbs), then
# runs the QMP harness: boot and check the shell is on screen with
# appd + aid answering PING (the M4.5 stack still works); in the
# Terminal, prove the network is up (`net status` + `net dns`), open
# a page served by the host over the guest network and prove it
# RENDERS (red-block pixels in the Chromium window — the old build's
# "wifi connected, browser dead" failure is the named acceptance
# test); load a real public page over the internet and prove it
# renders (the runner has direct internet, unlike the sandbox); open
# Sevyn Code in the browser and prove the IDE paints in a window
# (the M4 open item); switch tabs and prove the first page comes
# back. The M4.5 check runs as a regression on the same image.
# Boot logs, screendumps, the data disk, and the JSON result are kept
# as artifacts.
#
# The Hermes build is the slow step (10-20 min on a 2-core runner); the
# deps dir is cached on the pinned versions + build-deps.sh hash, so a
# warm cache makes this job about as fast as M4.5. The code-server
# tarball (~120 MB) and the Chromium zip (~260 MB) download on every
# run.
name: SevynOS v2 M5

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-m5.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-m5.yml"

jobs:
  m5-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node v5 defaults package-manager-cache to true and
          # auto-detects pnpm from the repo root's packageManager field —
          # but this job uses npm only (v2/rn/renderer, v2/shell) and
          # never installs pnpm, so the cache step fails with "Unable to
          # locate executable file: pnpm". The Hermes/Yoga deps cache is
          # handled by the actions/cache step below.
          package-manager-cache: false

      - name: Install build + boot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            linux-image-generic \
            busybox-static \
            cpio \
            zstd \
            gcc \
            g++ \
            cmake \
            ninja-build \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libfreetype-dev \
            libpng-dev \
            libssl-dev \
            weston \
            seatd \
            udev \
            libgl1-mesa-dri \
            adwaita-icon-theme \
            fonts-dejavu-core \
            xkb-data \
            e2fsprogs \
            curl \
            unzip \
            ca-certificates \
            fontconfig \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libcups2 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            libdbus-1-3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libgbm1 \
            libdrm2 \
            libxkbcommon0 \
            libexpat1 \
            libxcb1 \
            libxext6 \
            libfontconfig1 \
            libfreetype6 \
            libharfbuzz0b \
            libudev1 \
            libglib2.0-0 \
            libx11-6 \
            libxi6 \
            libxrender1 \
            libxtst6 \
            libxss1

      - name: Cache native deps (Hermes + Yoga)
        uses: actions/cache@v4
        with:
          path: v2/rn/host/deps
          key: sevynos-v2-deps-${{ hashFiles('v2/rn/host/build-deps.sh') }}-hermes-0.13.0-yoga-41118bd
          restore-keys: |
            sevynos-v2-deps-

      - name: Build native deps
        run: sh v2/rn/host/build-deps.sh

      - name: Renderer + shell + apps JS checks
        run: |
          cd v2/rn/renderer && npm ci --no-audit --no-fund && npm test
          cd ../../shell && npm ci --no-audit --no-fund && npm run typecheck && npm run build && npm test
          cd ../apps && npm ci --no-audit --no-fund && npm run typecheck && npm run build && npm test

      - name: Loader + appd + updater checks
        run: |
          python3 v2/loader/test-loader.py
          python3 v2/loader/test-appd.py
          python3 v2/ai/test-aid.py
          python3 v2/update/test-updated.py
          python3 v2/update/test-browser.py

      - name: Build the M5 image
        run: |
          # The harness boots the built image as version m5-test-1,
          # so the image and the check agree on the version string.
          sudo env SEVYN_V2_VERSION=m5-test-1 sh v2/image/build-m5-image.sh

      - name: Run the M5 check in QEMU
        run: |
          # The build step runs under sudo, so v2/image/build/ is
          # root-owned; hand it back to the runner first, or the check
          # cannot create m5-boot-*.log (EACCES — the M1 failure mode).
          sudo chown -R "$USER" v2/image/build
          node v2/image/m5-check.mjs

      - name: Run the M4.5 check in QEMU (regression on the M5 image)
        run: |
          node v2/image/m4.5-check.mjs

      - name: Upload M5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sevynos-v2-m5
          path: |
            v2/image/build/m5-boot-*.log
            v2/image/build/m5-check.json
            v2/image/build/m5-shot-*.ppm
            v2/image/build/m5-data.img
            v2/image/build/m4.5-boot-*.log
            v2/image/build/m4.5-check.json
            v2/image/build/m4.5-shot-*.ppm
            v2/image/build/m4.5-data.img
          if-no-files-found: warn
