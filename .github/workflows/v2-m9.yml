# SevynOS v2 M9 — build the desktop-polish image and prove it in
# QEMU (Kevon, 2026-11-09: M9 is the desktop polish from his GF65
# report — full-screen desktop, wifi in Settings, movable/resizable
# windows, real app content — plus the installer: in-place updates
# on bare metal via the ESP sync).
#
# Runs on pushes and PRs touching v2/ (the fresh build). The job builds
# the native deps (Hermes + Yoga, cached), the shell + app bundles, the
# loader + app daemon + update daemon + CLI + AI daemon, and the M9
# image (the M7 image plus the polish + the ESP-sync updater), then
# runs the m9-check harness:
#   0. (Removed while Tokrah is out of the build — Kevon,
#      2026-11-25: the Node harness gate built the Tokrah bundle
#      and ran the live flow against the mock API. It comes back
#      with Tokrah; v2/tokrah/ stays in the tree, dormant.)
#   1. the regression boot: -kernel/-initrd + the M6 data disk (now
#      LABEL=SEVYN_DATA) at 1920x1080 — proves the polish (full-screen
#      shell, move/resize drags, Settings wifi UI, real calculator /
#      calendar / store screens) did not break the QEMU path;
#   2. the UEFI boots: OVMF (Secure Boot variant) + the GPT disk image
#      on a QEMU NVMe device — the boot path the GF65 will use. The
#      first UEFI boot drives a test-signed update over the slirp
#      host HTTP server and proves the ESP sync (new kernel on the
#      ESP, old kernel preserved as .prev, grub.cfg with default +
#      previous entries) and the reboot into the new slot; the second
#      proves the fallback restore (a twice-failed slot flips back
#      to the good slot with the ESP restored).
# Boot logs, screendumps, the data disk, and the JSON result are kept
# as artifacts. sevynos.img itself is NOT uploaded here (1.5 GiB) —
# the nightly (public-build.yml) publishes it on merge.
#
# Tokrah is TEMPORARILY OUT of the build (Kevon, 2026-11-25) — this
# job no longer clones the private Tokrah repo and no longer needs
# the TOKRAH_READ_TOKEN secret. v2/tokrah/ stays in the tree,
# dormant; re-inclusion restores the clone step and the bundle.
name: SevynOS v2 M9

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-m9.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-m9.yml"

jobs:
  m9-check:
    runs-on: [self-hosted, sevynos-kvm]
    env:
      SEVYN_V2_ACCEL: kvm
    timeout-minutes: 180
    steps:
      - name: Reclaim workspace from a previous sudo build
        # The image build runs under sudo, so a previous job killed
        # before its end-of-job chown can leave root-owned files in
        # the workspace; checkout cannot clean them (EACCES) and dies
        # before any later chown can run. Reclaim first.
        run: sudo chown -R "$USER" "$GITHUB_WORKSPACE" || true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No package-manager cache here: this job installs deps
          # with npm ci directly. The Hermes/Yoga deps cache is
          # handled by the actions/cache step below.
          package-manager-cache: false

      - name: Install build + boot dependencies
        run: |
          # Several self-hosted runners share this box, so concurrent
          # apt runs fight over the dpkg lock — retry a few times.
          apt_ok=0
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq \
            qemu-system-x86 \
            linux-image-generic \
            busybox-static \
            cpio \
            zstd \
            gcc \
            g++ \
            cmake \
            ninja-build \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libfreetype-dev \
            libpng-dev \
            libssl-dev \
            weston \
            seatd \
            udev \
            libgl1-mesa-dri \
            adwaita-icon-theme \
            fonts-dejavu-core \
            xkb-data \
            e2fsprogs \
            curl \
            unzip \
            ca-certificates \
            fontconfig \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libcups2 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            libdbus-1-3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libgbm1 \
            libdrm2 \
            libxkbcommon0 \
            libexpat1 \
            libxcb1 \
            libxext6 \
            libfontconfig1 \
            libfreetype6 \
            libharfbuzz0b \
            libudev1 \
            libglib2.0-0 \
            libx11-6 \
            libxi6 \
            libxrender1 \
            libxtst6 \
            libxss1 \
            ovmf \
            wpasupplicant \
            iw \
            grub-efi-amd64-signed \
            grub-efi-amd64 \
            shim-signed \
            dosfstools \
            gdisk \
            mtools; then
              apt_ok=1
              break
            fi
            sleep 20
          done
          [ "$apt_ok" = 1 ]

      - name: Cache native deps (Hermes + Yoga)
        uses: actions/cache@v4
        with:
          path: v2/rn/host/deps
          key: sevynos-v2-deps-${{ hashFiles('v2/rn/host/build-deps.sh') }}-hermes-0.13.0-yoga-41118bd
          restore-keys: |
            sevynos-v2-deps-

      - name: Build native deps
        run: sh v2/rn/host/build-deps.sh

      - name: Renderer + shell + apps JS checks
        run: |
          cd v2/rn/renderer && npm ci --no-audit --no-fund && npm test
          cd ../../shell && npm ci --no-audit --no-fund && npm run typecheck && npm run build && npm test
          cd ../apps && npm ci --no-audit --no-fund && npm run typecheck && npm run build && npm test

      - name: Loader + appd + updater checks
        run: |
          python3 v2/loader/test-loader.py
          python3 v2/loader/test-appd.py
          python3 v2/ai/test-aid.py
          python3 v2/update/test-updated.py
          python3 v2/update/test-browser.py

      - name: Build the M9 image
        run: |
          # The harness boots the built image as version m9-test-1,
          # so the image and the check agree on the version string.
          sudo env SEVYN_V2_VERSION=m9-test-1 sh v2/image/build-m9-image.sh

      - name: Run the M9 check in QEMU
        run: |
          # The build step runs under sudo, so v2/image/build/ is
          # root-owned; hand it back to the runner first, or the check
          # cannot create m9-boot-*.log (EACCES — the M1 failure mode).
          sudo chown -R "$USER" v2/image/build
          node v2/image/m9-check.mjs

      - name: Fail if the M9 check produced no verdict
        # Backstop for a silent harness exit: the check must write
        # v2/image/build/m9-check.json with pass=true. A run that
        # exits 0 without a verdict file (the bisect false green,
        # run 46166095132 — QMP socket closed mid-drag, node exited 0
        # with no verdict) previously read as a green job.
        if: always()
        run: |
          python3 - <<'EOF'
          import json, sys
          path = "v2/image/build/m9-check.json"
          try:
              with open(path) as f:
                  result = json.load(f)
          except FileNotFoundError:
              print("m9-check.json missing: the harness exited without a verdict")
              sys.exit(1)
          except json.JSONDecodeError as e:
              print(f"m9-check.json unreadable: {e}")
              sys.exit(1)
          if result.get("pass") is not True:
              print("m9-check.json pass=false: the M9 check failed")
              sys.exit(1)
          print("m9-check.json pass=true")
          EOF

      - name: Upload M9 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sevynos-v2-m9
          path: |
            v2/image/build/m9-boot-*.log
            v2/image/build/m9-uefi-boot-*.log
            v2/image/build/m9-check.json
            v2/image/build/m9-shot-*.ppm
            v2/image/build/m9-data.img
          if-no-files-found: warn
