# SevynOS v2 M13 — the Chromium browser embed (Kevon, 2026-11-14:
# "Start the browser now" — native Chromium embed, Edge model:
# Chromium engine + SevynOS's own UI; 60 fps is the gate, the GF65
# is the proof QEMU cannot give).
#
# Runs on pushes and PRs touching v2/ (the fresh build). The job builds
# the native deps (Hermes + Yoga, cached), the shell + app bundles, the
# loader + app daemon + update daemon + CLI + AI daemon, and the M13
# image (the M12 image plus the browser embed: Chromium as a chromeless
# app-mode content window paired with the Browser app window, GPU tried
# first with a software fallback, pidfile/state-file lifecycle), then
# runs the m13-check harness (forked from m5-check):
#   1. Genesis-live set (the M12 proofs still hold on this image):
#      Weston runs the GL renderer, the host's GPU present path is
#      live, frames flow, and the shell mounts and paints.
#   2. Browser status + CDP: `sevyn browser status` reports running
#      + CDP answering + a `gpu:` line, and a real page renders in
#      the Chromium window (title over CDP AND pixels on screen).
#   3. Address-bar typing in the Browser app drives Chromium to a
#      new page; an in-page click navigates; tab switching brings
#      the first page back.
#   4. Chromeless heuristic: the Chromium window carries no browser
#      UI of its own — the Browser app is the only chrome.
#   5. Close kills Chromium: closing the Browser app quits Chromium
#      (`sevyn browser quit` / pidfile gone, no orphan process).
#   6. Clean poweroff.
# The m12-check runs as a regression on the same image.
# Boot logs, screendumps and the JSON result are kept as artifacts.
# sevynos.img itself is NOT uploaded here (1.5 GiB) — the nightly
# (public-build.yml) publishes it on merge.
#
# QEMU has no GPU: the guest init forces Mesa's software driver
# (LIBGL_ALWAYS_SOFTWARE=1 → swrast/llvmpipe) so Weston and the host
# render GL in software into virtio-gpu dumb buffers — the CPU-only
# product path, not a CI workaround. The fps sample is a liveness
# signal only — the check asserts the line exists, never its value.
# Real-hardware behaviour (iris on the GF65 Intel iGPU, 60 fps) is
# Kevon's GF65 verification after merge — the PR body says so.
#
# Tokrah is TEMPORARILY OUT of the build (Kevon, 2026-11-25) — this
# job no longer clones the private Tokrah repo and no longer needs
# the TOKRAH_READ_TOKEN secret. v2/tokrah/ stays in the tree,
# dormant; re-inclusion restores the clone step and the bundle.
name: SevynOS v2 M13

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-m13.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-m13.yml"

jobs:
  m13-check:
    runs-on: [self-hosted, sevynos-kvm]
    env:
      SEVYN_V2_ACCEL: kvm
    timeout-minutes: 300
    steps:
      - name: Reclaim workspace from a previous sudo build
        # The image build runs under sudo, so a previous job killed
        # before its end-of-job chown can leave root-owned files in
        # the workspace; checkout cannot clean them (EACCES) and dies
        # before any later chown can run. Reclaim first.
        run: sudo chown -R "$USER" "$GITHUB_WORKSPACE" || true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No package-manager cache here: this job installs deps
          # with npm ci directly. The Hermes/Yoga deps cache is
          # handled by the actions/cache step below.
          package-manager-cache: false

      - name: Install build + boot dependencies
        run: |
          # Several self-hosted runners share this box, so concurrent
          # apt runs fight over the dpkg lock — retry a few times.
          apt_ok=0
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq \
            qemu-system-x86 \
            linux-image-generic \
            busybox-static \
            cpio \
            zstd \
            gcc \
            g++ \
            cmake \
            ninja-build \
            pkg-config \
            libwayland-dev \
            libegl-dev \
            libgles-dev \
            wayland-protocols \
            libfreetype-dev \
            libpng-dev \
            libjpeg-turbo8-dev \
            libssl-dev \
            weston \
            seatd \
            udev \
            libgl1-mesa-dri \
            adwaita-icon-theme \
            fonts-dejavu-core \
            xkb-data \
            e2fsprogs \
            curl \
            unzip \
            ca-certificates \
            fontconfig \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libcups2 \
            libasound2t64 \
            libasound2-dev \
            libpango-1.0-0 \
            libcairo2 \
            libdbus-1-3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libgbm1 \
            libdrm2 \
            libxkbcommon0 \
            libexpat1 \
            libxcb1 \
            libxext6 \
            libfontconfig1 \
            libfreetype6 \
            libharfbuzz0b \
            libudev1 \
            libglib2.0-0 \
            libx11-6 \
            libxi6 \
            libxrender1 \
            libxtst6 \
            libxss1 \
            ovmf \
            wpasupplicant \
            iw \
            grub-efi-amd64-signed \
            grub-efi-amd64 \
            shim-signed \
            dosfstools \
            gdisk \
            mtools \
            efibootmgr \
            ntfs-3g; then
              # UVC camera modules (videobuf2-core et al.) ship in
              # linux-modules-extra, not the base linux-modules package —
              # without them the M13 image build fails at stage-modules.py
              # with "module videobuf2-core not found". There is no
              # linux-modules-extra-generic metapackage in noble (apt
              # cannot locate it), so install the -extra package for the
              # newest generic kernel in /boot — the same kernel
              # build-m13-image.sh picks.
              KVER="$(basename "$(ls /boot/vmlinuz-*-generic | sort -V | tail -n 1)" | sed 's/^vmlinuz-//')"
              if sudo apt-get install -y -qq "linux-modules-extra-${KVER}"; then
                apt_ok=1
                break
              fi
            fi
            sleep 20
          done
          [ "$apt_ok" = 1 ]

      - name: Cache native deps (Hermes + Yoga)
        uses: actions/cache@v4
        with:
          path: v2/rn/host/deps
          key: sevynos-v2-deps-${{ hashFiles('v2/rn/host/build-deps.sh') }}-hermes-0.13.0-yoga-41118bd
          restore-keys: |
            sevynos-v2-deps-

      - name: Build native deps
        run: sh v2/rn/host/build-deps.sh

      - name: Renderer + shell + apps JS checks
        run: |
          cd v2/rn/renderer && npm ci --no-audit --no-fund && npm test
          cd ../../shell && npm ci --no-audit --no-fund && npm run typecheck && npm run build && npm test
          cd ../apps && npm ci --no-audit --no-fund && npm run typecheck && npm run build && npm test

      - name: Loader + appd + updater checks
        run: |
          python3 v2/loader/test-loader.py
          python3 v2/loader/test-appd.py
          python3 v2/ai/test-aid.py
          python3 v2/update/test-updated.py
          python3 v2/update/test-browser.py

      - name: Build the M13 image
        run: |
          # The harness boots the built image as version m13-test-1,
          # so the image and the check agree on the version string.
          sudo env SEVYN_V2_VERSION=m13-test-1 sh v2/image/build-m13-image.sh

      - name: Run the M13 check in QEMU
        env:
          # Relay 1b: the guest check joins an in-job Headscale
          # (the control protocol has no mock — a real Headscale
          # binary is the only join proof). The step downloads the
          # pinned binaries below; the check starts Headscale on
          # 0.0.0.0:8080 and joins the guest + a host node against
          # it. It never touches the live server.
          SEVYN_V2_HEADSCALE: "1"
        run: |
          # The build step runs under sudo, so v2/image/build/ is
          # root-owned; hand it back to the runner first, or the check
          # cannot create m13-boot-*.log (EACCES — the M1 failure mode).
          sudo chown -R "$USER" v2/image/build
          # Relay 1b: pinned + sha256-verified — the same versions
          # the image (Tailscale 1.104.7) and the live server
          # (Headscale 0.29.7) run.
          mkdir -p v2/image/build/headscale
          cd v2/image/build/headscale
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o headscale \
            https://github.com/juanfont/headscale/releases/download/v0.29.7/headscale_0.29.7_linux_amd64
          echo "e827fc9b12d958bc95b081c4401dd63f8e0471d025b45b508535a920532150a8  headscale" | sha256sum -c -
          chmod +x headscale
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o tailscale.tar.gz \
            https://pkgs.tailscale.com/stable/tailscale_1.104.7_amd64.tgz
          echo "e56693ff74a64f2591b7e819c280635a100aae1ddfb0ef058fcd052b7cd8d16c  tailscale.tar.gz" | sha256sum -c -
          tar xzf tailscale.tar.gz
          test -x "tailscale_1.104.7_amd64/tailscale"
          ./headscale version
          ./tailscale_1.104.7_amd64/tailscale version
          cd "$GITHUB_WORKSPACE"
          node v2/image/m13-check.mjs

      - name: Run the M12 check in QEMU (regression on the M13 image)
        run: |
          node v2/image/m12-check.mjs

      - name: Upload M13 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sevynos-v2-m13
          path: |
            v2/image/build/m13-boot-*.log
            v2/image/build/m13-check.json
            v2/image/build/m13-shot-*.ppm
            v2/image/build/m13-data.img
            v2/image/build/m12-boot-*.log
            v2/image/build/m12-check.json
            v2/image/build/m12-data.img
          if-no-files-found: warn
